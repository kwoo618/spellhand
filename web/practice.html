<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지문자 훈련</title>
<style>
  /* 시선은 로봇손에 있어야 한다. 화면은 상태를 알려 주고 입력을 받는 것까지다.
     색 강조와 움직임을 최소로 두고 여백과 대비로만 구분한다 (PRD 14.1). */
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d8d8d8;
    --paper: #fbfbfa;
    --accent: #2f2f2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 4rem 1.5rem;
  }
  main { width: 100%; max-width: 30rem; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 3rem;
  }
  .learner { font-weight: 600; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; }

  .status {
    min-height: 4rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--muted);
  }
  /* 정지는 손이 움직이는 동안에만 나타난다. 찾을 수 있으면 되고, 시선을
     끌 필요는 없다 — 시선은 로봇손에 있어야 한다 (PRD 14.1). */
  .status .stop {
    margin-left: auto;
    flex: none;
    padding: 0.4rem 0.9rem;
    border-color: #8a2b2b;
    color: #8a2b2b;
  }
  .status .stop[hidden] { display: none; }
  .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--line); flex: none;
  }
  .dot.live { background: var(--accent); }

  label { display: block; margin-bottom: 0.5rem; color: var(--muted); }
  input[type="text"] {
    width: 100%;
    padding: 0.85rem 1rem;
    font: inherit;
    font-size: 1.4rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="text"]:disabled { background: #f2f2f1; color: var(--muted); }

  .row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 0.7rem 1.2rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }

  .result { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .result[hidden] { display: none; }
  .verdict { font-weight: 600; }
  .reveal { font-size: 1.3rem; letter-spacing: 0.3em; margin: 0.5rem 0; }
  .hint { color: var(--muted); }
  .note { color: var(--muted); font-size: 0.9rem; }

  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  caption { text-align: left; font-weight: 600; padding-bottom: 0.4rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; }
  td { font-variant-numeric: tabular-nums; }

  .error { color: #8a2b2b; }

  /* 복구 수단. 학습 흐름의 일부가 아니므로 눈에 띄지 않는 자리에 둔다.
     정지(위, 테두리 있는 버튼)와 달리 밑줄 글자다 — 결과가 다른 두 기능이
     같아 보이면 안 된다 (DECISIONS.md §45). */
  .recovery { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .recovery button {
    padding: 0.3rem 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .recovery button.armed { color: #8a2b2b; text-decoration: none; font-weight: 600; }
  .recovery .note { display: inline; margin-left: 0.6rem; }
</style>
</head>
<body>
<main>
  <header>
    <span class="learner" id="learner">—</span>
    <span class="counter" id="counter"></span>
  </header>

  <!-- 시작 -->
  <section id="startPanel">
    <label for="name">이름</label>
    <input type="text" id="name" autocomplete="off" style="letter-spacing:normal;text-transform:none">
    <div class="row">
      <button class="primary" id="startBtn">세션 시작</button>
    </div>
    <p class="note" id="startNote"></p>
  </section>

  <!-- 훈련 -->
  <section id="trainPanel" hidden>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">준비 중</span>
      <button class="stop" id="stopBtn" type="button" hidden>정지</button>
    </div>

    <label for="answer">읽은 글자</label>
    <input type="text" id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" disabled>
    <div class="row">
      <button class="primary" id="submitBtn" disabled>제출</button>
      <button id="replayBtn" disabled>다시 보기</button>
      <button id="demoBtn" disabled>시범 다시 보기</button>
    </div>

    <div class="result" id="result" hidden>
      <p class="verdict" id="verdict"></p>
      <p class="reveal" id="reveal"></p>
      <p class="hint" id="hint"></p>
      <div class="row"><button class="primary" id="nextBtn">다음 문항</button></div>
    </div>
  </section>

  <!-- 요약 -->
  <section id="summaryPanel" hidden>
    <h2>세션 요약</h2>
    <p class="note">
      두 트랙은 훈련하는 기술이 다르므로 따로 봅니다. 합친 수치는 내지 않습니다.
    </p>
    <div id="summaryTables"></div>
    <div class="row"><button class="primary" id="againBtn">처음으로</button></div>
  </section>

  <p class="error" id="error"></p>

  <div class="recovery">
    <button id="resetBtn" type="button">세션 끝내고 손 놓기</button>
    <span class="note" id="resetNote"></span>
  </div>
</main>

<script>
"use strict";

const TRACK_LABEL = { discrimination: "판별", word: "단어" };
const RESULT_LABEL = {
  correct: "정답",
  wrong: "글자를 잘못 읽었습니다",
  length: "글자 수가 다릅니다",
  order: "글자는 맞고 순서가 다릅니다",
};

const el = (id) => document.getElementById(id);
const state = {
  sessionId: null,
  total: 0,
  prompt: null,
  socket: null,
  demoAvailable: false,
};

function show(id, visible) { el(id).hidden = !visible; }
function setError(message) { el("error").textContent = message || ""; }

// --------------------------------------------------------------------- //
// 거부 문구 — 코드는 서버 것 그대로, 읽는 쪽에서만 옮긴다
// --------------------------------------------------------------------- //

/**
 * 거부 코드 → 학습자가 읽을 문구.
 *
 * 학습자는 대괄호 코드도, 영어도, 파이썬 리스트 표기도 알 필요가 없다.
 * **서버의 거부 코드는 그대로 둔다** — 바꾸는 것은 표시뿐이고, 원문은
 * `console.warn` 으로 개발자 도구에 그대로 남는다.
 *
 * 여기 없는 코드는 `FALLBACK_TEXT` 로 떨어진다. 문구가 없다고 오류를 삼키지
 * 않는다 — 학습자에게는 "무엇을 하면 되는가" 를, 개발자에게는 콘솔의 원문을
 * 남긴다.
 */
const REJECTION_TEXT = {
  UNSUPPORTED_LETTERS: (p) =>
    `이 손은 ${letterList(p.letters) || "그 글자"}를 표현할 수 없습니다.` +
    (p.alternatives && p.alternatives.length
      ? ` 표현 가능한 글자는 ${letterList(p.alternatives)} 입니다.`
      : ""),
  LOCK_UNAVAILABLE: () =>
    "다른 사람이 로봇손을 쓰고 있습니다. " +
    "화면 아래 [세션 끝내고 손 놓기] 를 누른 뒤 다시 시작하세요.",
  LOCK_NOT_HELD: () =>
    "이 세션은 로봇손을 놓았습니다. " +
    "화면 아래 [세션 끝내고 손 놓기] 를 누른 뒤 처음부터 다시 시작하세요.",
  CURRICULUM_VIOLATION: () =>
    "아직 나올 차례가 아닌 글자 조합입니다. 앞 단계를 마치면 나옵니다.",
  RATE_LIMIT: () => "너무 빨리 눌렀습니다. 잠시 뒤에 다시 눌러 주세요.",
  SESSION_QUOTA: () =>
    "이번 세션에서 손을 움직일 수 있는 횟수를 다 썼습니다. " +
    "세션을 마치고 새로 시작하세요.",
  DEVICE_BUSY: () => "로봇손이 아직 움직이고 있습니다. 멈출 때까지 기다려 주세요.",
  DEVICE_TIMEOUT: () =>
    "로봇손이 응답하지 않습니다. 선생님께 알려 주세요.",
  DEVICE_FAILED: () =>
    "로봇손이 응답하지 않습니다. 선생님께 알려 주세요.",
  SESSION_FINISHED: () => "계획된 문항을 모두 마쳤습니다.",
  SESSION_STATE: () => "지금은 할 수 없는 동작입니다. 화면의 안내를 따라 주세요.",
};

const FALLBACK_TEXT =
  "문제가 생겨 더 진행하지 못했습니다. 선생님께 알려 주세요.";

/** `['B','D']` 가 아니라 `B D`. 학습자가 읽는 것은 글자지 리스트가 아니다. */
function letterList(values) {
  return (values || []).join(" ");
}

function learnerText(code, payload) {
  const write = REJECTION_TEXT[code];
  return write ? write(payload || {}) : FALLBACK_TEXT;
}

/**
 * 구조화된 거부를 Error 로 바꾼다.
 *
 * `message` 는 학습자용 문구다. 코드는 `error.code` 에 남겨 호출자가 분기할 수
 * 있게 한다 — 문구에서 코드를 찾는 문자열 검사는 문구를 고치는 순간 깨진다.
 */
function rejection(payload, response) {
  const code = payload.code || (response ? String(response.status) : "");
  const detail = payload.detail || (response ? response.statusText : "");
  // 원문은 여기 그대로 남는다. 화면에서만 가린다.
  console.warn(`[${code}] ${detail}`, payload);
  const error = new Error(learnerText(code, payload));
  error.code = code;
  error.detail = detail;
  return error;
}

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  const payload = text ? JSON.parse(text) : {};
  if (!response.ok) throw rejection(payload, response);
  return payload;
}

// --------------------------------------------------------------------- //
// 상태 표시 — WS 는 받기만 한다. 명령은 전부 REST 로 나간다.
// --------------------------------------------------------------------- //

function openSocket(sessionId) {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${scheme}://${location.host}/ws/session/${sessionId}`);
  socket.onmessage = (event) => handleEvent(JSON.parse(event.data));
  socket.onclose = () => { el("dot").classList.remove("live"); };
  state.socket = socket;
}

function handleEvent(event) {
  switch (event.type) {
    case "presenting":
      el("dot").classList.add("live");
      el("status").textContent =
        event.attempt > 1 ? "다시 표현 중 — 천천히 봅니다" : "표현 중";
      setAnswering(false);
      setMoving(true);
      break;
    case "ready":
      el("status").textContent = `표현 중 — ${event.letter_pos + 1}번째 글자`;
      break;
    case "done":
      el("dot").classList.remove("live");
      el("status").textContent = "읽은 글자를 입력하세요";
      setMoving(false);
      setAnswering(true);
      break;
    case "demo":
      el("status").textContent = `시범: ${event.letters.join(" · ")}`;
      setMoving(false);
      break;
    case "error":
      el("dot").classList.remove("live");
      setMoving(false);
      if (event.code === "STOPPED") {
        // 사람이 멈춘 것이다. 오류가 아니므로 오류 자리에 쓰지 않는다.
        showStopped();
      } else {
        // WS 거부도 REST 와 같은 몸통이다. 같은 표에서 문구를 꺼낸다.
        console.warn(`[${event.code}] ${event.detail || ""}`, event);
        setError(learnerText(event.code, event));
      }
      break;
  }
}

function setAnswering(enabled) {
  el("answer").disabled = !enabled;
  el("submitBtn").disabled = !enabled;
  el("replayBtn").disabled = !enabled;
  if (enabled) el("answer").focus();
}

/** 손이 움직이는 동안에만 정지 버튼을 보인다. */
function setMoving(moving) {
  el("stopBtn").hidden = !moving;
}

/** 정지 직후의 표시. 문항은 그대로이므로 다시 보기로 이어 간다. */
function showStopped() {
  el("status").textContent = "정지했습니다 — [다시 보기] 로 이어서 봅니다";
  el("replayBtn").disabled = false;
}

// --------------------------------------------------------------------- //
// 흐름
// --------------------------------------------------------------------- //

async function startSession() {
  setError("");
  const name = el("name").value.trim();
  if (!name) { el("startNote").textContent = "이름을 입력하세요."; return; }

  try {
    const session = await call("POST", "/api/sessions", { learner_name: name });
    state.sessionId = session.session_id;
    state.total = session.total_items;
    el("learner").textContent = name;
    show("startPanel", false);
    show("trainPanel", true);
    openSocket(session.session_id);
    await nextItem();
  } catch (err) {
    el("startNote").textContent = err.message;
  }
}

async function nextItem() {
  setError("");
  show("result", false);
  state.demoAvailable = false;
  el("demoBtn").disabled = true;
  el("answer").value = "";

  try {
    state.prompt = await call("GET", `/api/sessions/${state.sessionId}/next`);
  } catch (err) {
    // 계획된 문항을 다 냈다면 요약으로 넘어간다.
    if (err.code === "SESSION_FINISHED") { return endSession(); }
    setError(err.message);
    return;
  }
  renderCounter();
  await present();
}

function renderCounter() {
  const p = state.prompt;
  // 트랙은 보여 주고, 길이는 판별 트랙에서만 보여 준다 (PRD 14.1).
  const track = TRACK_LABEL[p.track] || p.track;
  const length = p.track === "discrimination" ? ` · ${p.length}글자` : "";
  el("counter").textContent = `${p.index} / ${state.total} · ${track}${length}`;
}

async function present() {
  setAnswering(false);
  setMoving(true);
  el("status").textContent = "표현 준비 중";
  try {
    await call("POST", `/api/sessions/${state.sessionId}/present`);
  } catch (err) {
    setMoving(false);
    setError(err.message);
  }
}

async function submit() {
  setError("");
  const answer = el("answer").value.trim();
  if (!answer) return;

  setAnswering(false);
  let outcome;
  try {
    outcome = await call("POST", `/api/sessions/${state.sessionId}/answer`, { answer });
  } catch (err) {
    setError(err.message);
    setAnswering(true);
    return;
  }

  if (outcome.retry) {
    // 오답 1회째. 정답은 알려주지 않고 같은 문항을 느리게 다시 낸다.
    el("status").textContent = "다시 한 번 봅니다";
    el("answer").value = "";
    state.prompt = await call("GET", `/api/sessions/${state.sessionId}/next`);
    renderCounter();
    await present();
    return;
  }

  renderResult(outcome);
  if (outcome.finished) {
    el("nextBtn").textContent = "요약 보기";
  }
}

function renderResult(outcome) {
  el("verdict").textContent = RESULT_LABEL[outcome.result] || outcome.result;
  el("reveal").textContent = outcome.expected ? `정답 ${outcome.expected}` : "";
  el("hint").textContent = outcome.demo && outcome.demo.hint ? outcome.demo.hint : "";
  state.demoAvailable = Boolean(outcome.demo);
  el("demoBtn").disabled = !state.demoAvailable;
  show("result", true);
  el("nextBtn").focus();
}

async function replayDemo() {
  if (!state.demoAvailable) return;
  setMoving(true);
  try {
    await call("POST", `/api/sessions/${state.sessionId}/demo`);
  } catch (err) {
    setMoving(false);
    setError(err.message);
  }
}

/** 비상 정지. 손만 멈춘다 — 세션은 그대로다. */
async function stopMotion() {
  try {
    await call("POST", "/api/device/stop");
  } catch (err) {
    setError(err.message);
    return;
  }
  el("dot").classList.remove("live");
  setMoving(false);
  showStopped();
}

async function endSession() {
  try {
    const summary = await call("POST", `/api/sessions/${state.sessionId}/end`);
    renderSummary(summary);
  } catch (err) {
    setError(err.message);
    return;
  }
  if (state.socket) state.socket.close();
  show("trainPanel", false);
  show("summaryPanel", true);
  el("counter").textContent = "";
}

function renderSummary(summary) {
  const container = el("summaryTables");
  container.innerHTML = "";

  for (const [track, s] of Object.entries(summary.by_track)) {
    const table = document.createElement("table");
    const pct = (v) => (v === null ? "—" : `${Math.round(v * 100)}%`);
    const ms = (v) => (v === null ? "—" : `${Math.round(v)}ms`);
    const confusions = (summary.confusions_by_track[track] || [])
      .map((c) => `${c.pair.join("/")} ${c.count}회`)
      .join(", ") || "—";

    table.innerHTML = `
      <caption>${TRACK_LABEL[track] || track} 트랙</caption>
      <tr><th>문항</th><td>${s.answered}</td></tr>
      <tr><th>정확도</th><td>${pct(s.accuracy)}</td></tr>
      <tr><th>순서 오류율</th><td>${pct(s.order_error_rate)}</td></tr>
      <tr><th>평균 응답</th><td>${ms(s.avg_response_ms)}</td></tr>
      <tr><th>혼동 쌍</th><td>${confusions}</td></tr>
    `;
    container.appendChild(table);
  }
}

// --------------------------------------------------------------------- //
// 강제 해제
// --------------------------------------------------------------------- //

/** 정지와 다르다. 세션이 끝나고 락이 반납된다. 한 번 눌러서는 실행되지 않는다. */
const RESET_LABEL = "세션 끝내고 손 놓기";
let resetArmed = null;

function disarmReset() {
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; }
  el("resetBtn").classList.remove("armed");
  el("resetBtn").textContent = RESET_LABEL;
}

async function resetDevice() {
  if (!resetArmed) {
    // 1단계: 확인을 받는다. 8초 안에 다시 누르지 않으면 없던 일이 된다.
    el("resetBtn").classList.add("armed");
    el("resetBtn").textContent = "정말 끝냅니다 — 한 번 더";
    el("resetNote").textContent =
      "진행 중인 세션이 중단됩니다. 답한 문항까지는 남습니다.";
    resetArmed = setTimeout(() => {
      disarmReset();
      el("resetNote").textContent = "";
    }, 8000);
    return;
  }

  clearTimeout(resetArmed);
  resetArmed = null;
  setError("");
  try {
    const result = await call("POST", "/api/device/reset");
    state.sessionId = null;
    if (state.socket) { state.socket.close(); state.socket = null; }
    disarmReset();
    // 무엇을 끝냈는지 그대로 쓴다. 끝낸 것이 없으면 없다고 쓴다.
    el("resetNote").textContent =
      result.ended_sessions.length
        ? `세션 ${result.ended_sessions.join(", ")} 을 종료하고 손을 놓았습니다.`
        : "잠긴 세션이 없습니다. 손을 안전 자세로 되돌렸습니다.";
    setMoving(false);
    el("dot").classList.remove("live");
    show("trainPanel", false);
    show("summaryPanel", false);
    show("startPanel", true);
  } catch (err) {
    disarmReset();
    el("resetNote").textContent = "";
    setError(err.message);
  }
}

// --------------------------------------------------------------------- //

el("stopBtn").addEventListener("click", stopMotion);
el("resetBtn").addEventListener("click", resetDevice);
el("startBtn").addEventListener("click", startSession);
el("name").addEventListener("keydown", (e) => { if (e.key === "Enter") startSession(); });
el("submitBtn").addEventListener("click", submit);
el("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
el("replayBtn").addEventListener("click", present);
el("demoBtn").addEventListener("click", replayDemo);
el("nextBtn").addEventListener("click", () => {
  if (el("nextBtn").textContent === "요약 보기") { endSession(); } else { nextItem(); }
});
el("againBtn").addEventListener("click", () => location.reload());

// 락 heartbeat. 세션이 살아 있음을 서버에 알린다 (PRD 10장: 15초 주기).
setInterval(() => {
  if (state.sessionId) {
    call("POST", `/api/sessions/${state.sessionId}/heartbeat`).catch(() => {});
  }
}, 10000);
</script>
</body>
</html>
