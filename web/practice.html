<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지문자 훈련</title>
<style>
  /* 시선은 로봇손에 있어야 한다. 화면은 상태를 알려 주고 입력을 받는 것까지다.
     색 강조와 움직임을 최소로 두고 여백과 대비로만 구분한다 (PRD 14.1). */
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d8d8d8;
    --paper: #fbfbfa;
    --accent: #2f2f2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 4rem 1.5rem;
  }
  main { width: 100%; max-width: 30rem; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 3rem;
  }
  .learner { font-weight: 600; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; }

  .status {
    min-height: 4rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--muted);
  }
  /* 정지는 손이 움직이는 동안에만 나타난다. 찾을 수 있으면 되고, 시선을
     끌 필요는 없다 — 시선은 로봇손에 있어야 한다 (PRD 14.1). */
  .status .stop {
    margin-left: auto;
    flex: none;
    padding: 0.4rem 0.9rem;
    border-color: #8a2b2b;
    color: #8a2b2b;
  }
  .status .stop[hidden] { display: none; }
  .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--line); flex: none;
  }
  .dot.live { background: var(--accent); }

  label { display: block; margin-bottom: 0.5rem; color: var(--muted); }
  input[type="text"] {
    width: 100%;
    padding: 0.85rem 1rem;
    font: inherit;
    font-size: 1.4rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="text"]:disabled { background: #f2f2f1; color: var(--muted); }

  .row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 0.7rem 1.2rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }

  .result { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .result[hidden] { display: none; }
  .verdict { font-weight: 600; }
  .reveal { font-size: 1.3rem; letter-spacing: 0.3em; margin: 0.5rem 0; }
  .hint { color: var(--muted); }
  .note { color: var(--muted); font-size: 0.9rem; }

  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  caption { text-align: left; font-weight: 600; padding-bottom: 0.4rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; }
  td { font-variant-numeric: tabular-nums; }

  .error { color: #8a2b2b; }

  /* 복구 수단. 학습 흐름의 일부가 아니므로 눈에 띄지 않는 자리에 둔다.
     정지(위, 테두리 있는 버튼)와 달리 밑줄 글자다 — 결과가 다른 두 기능이
     같아 보이면 안 된다 (DECISIONS.md §45). */
  .recovery { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .recovery button {
    padding: 0.3rem 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .recovery button.armed { color: #8a2b2b; text-decoration: none; font-weight: 600; }
  .recovery .note { display: inline; margin-left: 0.6rem; }
</style>
</head>
<body>
<main>
  <header>
    <span class="learner" id="learner">—</span>
    <span class="counter" id="counter"></span>
  </header>

  <!-- 시작 -->
  <section id="startPanel">
    <!-- 선생님이 승인한 세션이 열려 있을 때만 나온다. 이때 이름 입력은 숨는다 -->
    <div id="joinBox" hidden>
      <p class="note" id="joinNote"></p>
      <div class="row">
        <button class="primary" id="joinBtn">시작</button>
        <!-- 참여하지 않고 빠져나가는 길. 세션은 살려 둔다 -->
        <button id="laterBtn" type="button">나중에</button>
      </div>
    </div>

    <div id="newBox">
    <!-- [나중에] 로 빠져나온 뒤 돌아오는 길. 그 세션이 살아 있을 때만 나온다 -->
    <div class="row" id="rejoinRow" hidden>
      <button id="rejoinBtn" type="button"></button>
    </div>
    <label for="name">이름</label>
    <input type="text" id="name" autocomplete="off" style="letter-spacing:normal;text-transform:none">
    <div class="row">
      <button class="primary" id="startBtn">세션 시작</button>
    </div>
    </div>
    <p class="note" id="startNote"></p>
  </section>

  <!-- 훈련 -->
  <section id="trainPanel" hidden>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">준비 중</span>
      <button class="stop" id="stopBtn" type="button" hidden>정지</button>
    </div>

    <label for="answer">읽은 글자</label>
    <input type="text" id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" disabled>
    <div class="row">
      <button class="primary" id="submitBtn" disabled>제출</button>
      <button id="replayBtn" disabled>다시 보기</button>
      <button id="demoBtn" disabled>시범 다시 보기</button>
    </div>

    <div class="result" id="result" hidden>
      <p class="verdict" id="verdict"></p>
      <p class="reveal" id="reveal"></p>
      <p class="hint" id="hint"></p>
      <div class="row"><button class="primary" id="nextBtn">다음 문항</button></div>
    </div>
  </section>

  <!-- 요약 -->
  <section id="summaryPanel" hidden>
    <h2>세션 요약</h2>
    <p class="note">
      두 트랙은 훈련하는 기술이 다르므로 따로 봅니다. 합친 수치는 내지 않습니다.
    </p>
    <div id="summaryTables"></div>
    <div class="row"><button class="primary" id="againBtn">처음으로</button></div>
  </section>

  <p class="error" id="error"></p>

  <!-- 락이 실제로 잡혀 있을 때만 보인다. 잡힌 것이 없는데 권하면 시킨 대로
       눌러도 "잠긴 세션이 없습니다" 가 돌아온다 (§51) -->
  <div class="recovery" id="recoveryRow" hidden>
    <button id="resetBtn" type="button">세션 끝내고 손 놓기</button>
    <span class="note" id="resetNote"></span>
  </div>
</main>

<script>
"use strict";

const TRACK_LABEL = { discrimination: "판별", word: "단어" };
const RESULT_LABEL = {
  correct: "정답",
  wrong: "글자를 잘못 읽었습니다",
  length: "글자 수가 다릅니다",
  order: "글자는 맞고 순서가 다릅니다",
};

const el = (id) => document.getElementById(id);
const state = {
  sessionId: null,
  total: 0,
  prompt: null,
  socket: null,
  demoAvailable: false,
  // 참여할 수 있는 세션. `GET /api/sessions/open` 이 준 것을 그대로 들고 있다.
  open: null,
  // 승인된 계획에서 온 세션인가. 문항을 어디서 받는지가 이것으로 갈린다.
  planned: false,
  // 지금 문항이 손까지 도착했는가. 정지로 중간에 끊기면 false 로 남는다.
  landed: false,
  // [나중에] 로 접어 둔 세션 id. 그 세션에 대해서만 참여 자리를 숨긴다.
  declined: null,
};

function show(id, visible) { el(id).hidden = !visible; }
function setError(message) { el("error").textContent = message || ""; }

// --------------------------------------------------------------------- //
// 거부 문구 — 코드는 서버 것 그대로, 읽는 쪽에서만 옮긴다
// --------------------------------------------------------------------- //

/**
 * 거부 코드 → 학습자가 읽을 문구.
 *
 * 학습자는 대괄호 코드도, 영어도, 파이썬 리스트 표기도 알 필요가 없다.
 * **서버의 거부 코드는 그대로 둔다** — 바꾸는 것은 표시뿐이고, 원문은
 * `console.warn` 으로 개발자 도구에 그대로 남는다.
 *
 * 여기 없는 코드는 `FALLBACK_TEXT` 로 떨어진다. 문구가 없다고 오류를 삼키지
 * 않는다 — 학습자에게는 "무엇을 하면 되는가" 를, 개발자에게는 콘솔의 원문을
 * 남긴다.
 */
const REJECTION_TEXT = {
  UNSUPPORTED_LETTERS: (p) =>
    `이 손은 ${letterList(p.letters) || "그 글자"}를 표현할 수 없습니다.` +
    (p.alternatives && p.alternatives.length
      ? ` 표현 가능한 글자는 ${letterList(p.alternatives)} 입니다.`
      : ""),
  LOCK_UNAVAILABLE: () =>
    "다른 사람이 로봇손을 쓰고 있습니다. " +
    "화면 아래 [세션 끝내고 손 놓기] 를 누른 뒤 다시 시작하세요.",
  // **강제 해제를 시키지 않는다.** 이 코드가 왔다는 것은 이 세션이 락을
  // 놓았다는 뜻이고, 그 상태에서 해제를 누르면 "잠긴 세션이 없습니다" 가
  // 돌아온다 — 시킨 대로 했는데 없다는 답이 나온다 (§51). 다음에 무엇을
  // 하면 되는지는 `abandonSession()` 이 시작 화면에 적는다.
  LOCK_NOT_HELD: () => "이 세션은 로봇손을 놓았습니다.",
  CURRICULUM_VIOLATION: () =>
    "아직 나올 차례가 아닌 글자 조합입니다. 앞 단계를 마치면 나옵니다.",
  RATE_LIMIT: () => "너무 빨리 눌렀습니다. 잠시 뒤에 다시 눌러 주세요.",
  SESSION_QUOTA: () =>
    "이번 세션에서 손을 움직일 수 있는 횟수를 다 썼습니다. " +
    "세션을 마치고 새로 시작하세요.",
  DEVICE_BUSY: () => "로봇손이 아직 움직이고 있습니다. 멈출 때까지 기다려 주세요.",
  DEVICE_TIMEOUT: () =>
    "로봇손이 응답하지 않습니다. 선생님께 알려 주세요.",
  DEVICE_FAILED: () =>
    "로봇손이 응답하지 않습니다. 선생님께 알려 주세요.",
  SESSION_FINISHED: () => "계획된 문항을 모두 마쳤습니다.",
  SESSION_STATE: () => "지금은 할 수 없는 동작입니다. 화면의 안내를 따라 주세요.",
};

const FALLBACK_TEXT =
  "문제가 생겨 더 진행하지 못했습니다. 선생님께 알려 주세요.";

/** `['B','D']` 가 아니라 `B D`. 학습자가 읽는 것은 글자지 리스트가 아니다. */
function letterList(values) {
  return (values || []).join(" ");
}

function learnerText(code, payload) {
  const write = REJECTION_TEXT[code];
  return write ? write(payload || {}) : FALLBACK_TEXT;
}

/**
 * 구조화된 거부를 Error 로 바꾼다.
 *
 * `message` 는 학습자용 문구다. 코드는 `error.code` 에 남겨 호출자가 분기할 수
 * 있게 한다 — 문구에서 코드를 찾는 문자열 검사는 문구를 고치는 순간 깨진다.
 */
function rejection(payload, response) {
  const code = payload.code || (response ? String(response.status) : "");
  const detail = payload.detail || (response ? response.statusText : "");
  // 원문은 여기 그대로 남는다. 화면에서만 가린다.
  console.warn(`[${code}] ${detail}`, payload);
  const error = new Error(learnerText(code, payload));
  error.code = code;
  error.detail = detail;
  return error;
}

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  // 서버가 구조화되지 않은 몸통을 낼 수도 있다 — 잡히지 않은 예외의 500 이
  // 그렇다. 여기서 `JSON.parse` 가 터지면 학습자에게 파서 오류가 그대로
  // 보인다. 실제로 보였다 (DECISIONS §50.3).
  let payload = {};
  if (text) {
    try {
      payload = JSON.parse(text);
    } catch (err) {
      console.warn("응답이 JSON 이 아니다", response.status, text.slice(0, 500));
      payload = {};
    }
  }
  if (!response.ok) {
    const error = rejection(payload, response);
    // 내 세션에 보낸 요청이 409 로 막혔다. 세션이 죽었을 수 있으므로 확인을
    // 건다 — **기다리지 않는다.** 거부는 호출자가 지금 처리해야 하고, 확인은
    // 그와 별개로 끝난 뒤 화면을 정리한다 (§51).
    // `SESSION_FINISHED` 는 제외한다. 계획된 문항을 다 낸 것이고 **정상
    // 종료**다. 이것으로 확인을 걸면 요약을 보여주는 사이에 세션이 사라진
    // 것을 보고 시작 화면으로 돌려 버린다 — 학습자가 요약을 못 본다.
    if (state.sessionId !== null && response.status === 409 &&
        error.code !== "SESSION_FINISHED" &&
        path.startsWith(`/api/sessions/${state.sessionId}/`)) {
      confirmSessionAlive(error.code);
    }
    throw error;
  }
  return payload;
}

// --------------------------------------------------------------------- //
// 상태 표시 — WS 는 받기만 한다. 명령은 전부 REST 로 나간다.
// --------------------------------------------------------------------- //

function openSocket(sessionId) {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${scheme}://${location.host}/ws/session/${sessionId}`);
  socket.onmessage = (event) => handleEvent(JSON.parse(event.data));
  socket.onclose = () => { el("dot").classList.remove("live"); };
  state.socket = socket;
}

function handleEvent(event) {
  switch (event.type) {
    case "presenting":
      state.landed = false;
      el("dot").classList.add("live");
      el("status").textContent =
        event.attempt > 1 ? "다시 표현 중 — 천천히 봅니다" : "표현 중";
      setAnswering(false);
      setMoving(true);
      break;
    case "ready":
      el("status").textContent = `표현 중 — ${event.letter_pos + 1}번째 글자`;
      break;
    case "done":
      el("dot").classList.remove("live");
      el("status").textContent = "읽은 글자를 입력하세요";
      state.landed = true;
      setMoving(false);
      setAnswering(true);
      break;
    case "demo":
      el("status").textContent = `시범: ${event.letters.join(" · ")}`;
      setMoving(false);
      break;
    case "error":
      el("dot").classList.remove("live");
      setMoving(false);
      if (event.code === "STOPPED") {
        // 사람이 멈춘 것이다. 오류가 아니므로 오류 자리에 쓰지 않는다.
        showStopped();
      } else {
        // WS 거부도 REST 와 같은 몸통이다. 같은 표에서 문구를 꺼낸다.
        console.warn(`[${event.code}] ${event.detail || ""}`, event);
        setError(learnerText(event.code, event));
        // 세션이 살아 있으면 이어 갈 길을 남긴다. **여기서 길을 주지 않으면
        // 학습자에게 누를 것이 하나도 없다** — `present()` 가 다시 보기를
        // 비활성화한 채로 끝나기 때문이다. 실제로 그렇게 막혔다 (§50).
        // 살았는지 죽었는지는 서버가 `session_alive` 로 말해 준다. 코드
        // 목록으로 추측하면 코드를 하나 더할 때마다 다시 막힌다.
        if (event.session_alive) showStalled();
      }
      break;
  }
}

function setAnswering(enabled) {
  el("answer").disabled = !enabled;
  el("submitBtn").disabled = !enabled;
  el("replayBtn").disabled = !enabled;
  if (enabled) el("answer").focus();
}

/** 손이 움직이는 동안에만 정지 버튼을 보인다. */
function setMoving(moving) {
  el("stopBtn").hidden = !moving;
}

/** 정지 직후의 표시. 문항은 그대로이므로 다시 보기로 이어 간다. */
function showStopped() {
  el("status").textContent = "정지했습니다 — [다시 보기] 로 이어서 봅니다";
  el("replayBtn").disabled = false;
}

/**
 * 거부로 문항이 나가지 못했을 때의 표시. 세션은 살아 있다.
 *
 * 정지와 문구를 갈라 둔다 — 정지는 사람이 한 것이고 이쪽은 서버가 막은
 * 것이다. 같은 문구를 쓰면 학습자가 자기가 무언가 눌렀다고 생각한다.
 * 오류 자리(`setError`)는 호출한 쪽이 이미 채웠으므로 건드리지 않는다.
 */
function showStalled() {
  el("status").textContent = "문항이 나가지 못했습니다 — [다시 보기] 로 다시 시도합니다";
  el("replayBtn").disabled = false;
}

// --------------------------------------------------------------------- //
// 흐름
// --------------------------------------------------------------------- //

// --------------------------------------------------------------------- //
// 열린 세션에 참여 — 승인된 계획이 버려지지 않게 (DECISIONS §50)
// --------------------------------------------------------------------- //

/**
 * 열린 세션을 얼마나 자주 물어보는가.
 *
 * **짧게 잡지 않는다.** 이것은 선생님이 승인 버튼을 누르는 것을 기다리는
 * 것이고, 사람의 동작이다. 손이 움직이는 것을 따라가는 것이 아니다. 시작
 * 화면에 있을 때만 돌고, 참여하거나 새 세션을 내면 멈춘다.
 *
 * heartbeat(10초)와 같은 주기로 뒀다 — 화면이 서버에 말을 거는 간격이 두
 * 가지로 갈리면 무엇이 얼마나 자주 나가는지 읽기 어려워진다.
 */
const OPEN_POLL_MS = 10000;
let openPoll = null;

function stopOpenPoll() {
  if (openPoll) { clearInterval(openPoll); openPoll = null; }
}

function startOpenPoll() {
  if (!openPoll) { openPoll = setInterval(checkOpenSession, OPEN_POLL_MS); }
}

/**
 * 강제 해제를 내놓을지 정한다.
 *
 * **락이 실제로 잡혀 있을 때만이다.** 잡힌 것이 없는데 권하면, 시킨 대로
 * 눌러도 "잠긴 세션이 없습니다" 가 돌아온다. 사용자는 자기가 무엇을 잘못
 * 했는지 알 수 없다 (§51).
 */
function renderRecovery(lockHeld) {
  show("recoveryRow", Boolean(lockHeld));
  if (!lockHeld) { disarmReset(); el("resetNote").textContent = ""; }
}

/** 열린 세션이 있으면 참여 자리를, 없으면 이름 입력을 보인다. */
function renderOpenSession(open) {
  const joinable = Boolean(open && open.session_id);
  state.open = joinable ? open : null;
  // 손이 잡혀 있는지는 참여할 세션이 있는지와 **다른 사실**이다.
  renderRecovery(open && open.lock_holder !== null &&
                 open.lock_holder !== undefined);

  // 접어 둔 세션이 사라졌으면 접어 둔 사실도 버린다.
  if (state.declined !== null &&
      (!joinable || state.declined !== open.session_id)) {
    state.declined = null;
  }
  const declined = joinable && state.declined === open.session_id;

  show("joinBox", joinable && !declined);
  show("newBox", !joinable || declined);
  show("rejoinRow", declined);

  if (!joinable) { el("joinNote").textContent = ""; return; }

  // 몇 문항짜리인지까지 적는다. 선생님이 승인한 그 세션인지 학습자가
  // 확인할 수 있어야 한다.
  const who = open.learner_name ? `${open.learner_name} · ` : "";
  const label =
    `세션 ${open.session_id} 이 준비되어 있습니다 — ${who}${open.total_items}문항`;
  el("joinNote").textContent = label;
  el("rejoinBtn").textContent = `세션 ${open.session_id} 으로 참여하기`;
}

/**
 * 참여하지 않고 빠져나간다. **세션은 살려 둔다.**
 *
 * 지금까지는 이 화면에서 벗어나는 길이 강제 해제뿐이었고, 그것은 세션을
 * 죽인다 — 다른 사람이 쓰려던 세션을 끊게 된다 (§51). 접는 것은 이 화면에
 * 대해서만이고, 폴링은 계속 돌아 돌아올 길이 남는다.
 */
function declineJoin() {
  if (!state.open) return;
  state.declined = state.open.session_id;
  renderOpenSession(state.open);
  el("startNote").textContent =
    `세션 ${state.declined} 은 그대로 있습니다. 위 버튼으로 돌아갈 수 있습니다.`;
  el("name").focus();
}

function undeclineJoin() {
  state.declined = null;
  el("startNote").textContent = "";
  renderOpenSession(state.open);
}

/**
 * 이 세션은 더 못 쓴다. **한 곳에서만 버린다.**
 *
 * 화면이 죽은 `session_id` 를 계속 들고 있으면 heartbeat 와 구동 요청이
 * 409 를 반복한다. 실기 로그에 네 번 찍혔다 (§51). 버릴 때 같이 해야 하는
 * 일이 네 가지라, 흩어 놓으면 하나씩 빠진다.
 *
 * `message` 는 시작 화면에 남긴다 — 학습자가 왜 처음으로 돌아왔는지 알아야
 * 한다. 오류 자리에 쓰지 않는다. 오류는 이미 지나간 것이고, 지금 필요한 것은
 * 다음에 무엇을 하면 되는가다.
 */
function abandonSession(message) {
  // heartbeat 는 `state.sessionId` 를 보고 돈다. 비우는 것으로 멈춘다.
  state.sessionId = null;
  state.prompt = null;
  state.planned = false;
  state.landed = false;
  state.declined = null;
  if (state.socket) { state.socket.close(); state.socket = null; }

  setError("");
  setMoving(false);
  el("dot").classList.remove("live");
  el("counter").textContent = "";
  el("learner").textContent = "—";
  show("result", false);
  show("trainPanel", false);
  show("summaryPanel", false);
  show("startPanel", true);
  el("startNote").textContent = message || "";

  // 참여할 세션이 또 있을 수 있다. 조회를 되살리고 곧바로 한 번 묻는다.
  startOpenPoll();
  checkOpenSession();
}

/**
 * 세션 요청이 거부됐다. 그 세션이 아직 살아 있는지 **서버에 물어서** 정한다.
 *
 * 409 를 전부 "죽었다" 로 읽으면 안 된다 — `DEVICE_BUSY` 도 409 인데 그것은
 * 정지 직후의 겹친 구동이고 세션은 멀쩡하다 (§50.4). 그렇다고 코드 목록으로
 * 가르면 코드를 하나 더할 때마다 어긋난다. 참여 조회에 한 번 물어본다.
 *
 * **재시도가 아니다.** 실패한 요청을 다시 보내는 것이 아니고, 세션이 아직
 * 있는지만 확인한다. 확인은 요청 하나이고 결과는 둘 중 하나다.
 */
let confirming = false;

async function confirmSessionAlive(deadCode) {
  if (confirming || state.sessionId === null) return;
  confirming = true;
  const mine = state.sessionId;
  try {
    const open = await call("GET", "/api/sessions/open");
    if (state.sessionId !== mine) return;      // 그사이 바뀌었다
    if (open.session_id === mine) return;      // 살아 있다. 그냥 거부였다
    renderRecovery(open.lock_holder !== null && open.lock_holder !== undefined);
    abandonSession(
      `세션 ${mine} 이 끝났습니다. ` +
      (deadCode === "LOCK_NOT_HELD" ? "로봇손을 다른 곳에서 가져갔습니다. " : "") +
      "처음부터 다시 시작하세요."
    );
  } catch (err) {
    // 확인조차 실패했다. 여기서 세션을 버리지 않는다 — 서버가 잠깐 답하지
    // 않은 것일 수 있고, 멀쩡한 세션을 끊으면 진행 중인 문항이 날아간다.
    console.warn("could not confirm whether the session is alive", err);
  } finally {
    confirming = false;
  }
}

async function checkOpenSession() {
  if (state.sessionId) { stopOpenPoll(); return; }
  try {
    renderOpenSession(await call("GET", "/api/sessions/open"));
  } catch (err) {
    // 물어보다 실패한 것이다. 이름 입력을 막지 않는다 — 새 세션은 여전히
    // 낼 수 있다. 원문은 콘솔에 남는다.
    console.warn("could not check for an open session", err);
  }
}

/**
 * 이미 열린 세션으로 들어간다. **새로 만들지 않는다.**
 *
 * 락은 그 세션이 이미 쥐고 있다. 여기서 `POST /sessions` 를 부르면
 * `LOCK_UNAVAILABLE` 로 막히고, 막힌 것을 풀려고 `/device/reset` 을 부르면
 * 방금 승인한 세션이 죽는다. 그것이 §50 의 결함이었다.
 */
async function joinSession() {
  const open = state.open;
  if (!open) return;
  setError("");
  el("joinBtn").disabled = true;
  stopOpenPoll();

  state.sessionId = open.session_id;
  state.total = open.total_items;
  state.planned = Boolean(open.planned);
  state.declined = null;
  el("startNote").textContent = "";
  renderRecovery(true);
  el("learner").textContent = open.learner_name || "—";
  show("startPanel", false);
  show("trainPanel", true);
  openSocket(open.session_id);

  // 문항이 이미 걸려 있으면 그것을 이어서 본다. 아니면 다음 문항을 낸다.
  if (open.prompt) {
    state.prompt = open.prompt;
    renderCounter();
    await present();
  } else {
    await nextItem();
  }
  el("joinBtn").disabled = false;
}

async function startSession() {
  setError("");
  const name = el("name").value.trim();
  if (!name) { el("startNote").textContent = "이름을 입력하세요."; return; }

  try {
    const session = await call("POST", "/api/sessions", { learner_name: name });
    stopOpenPoll();
    state.sessionId = session.session_id;
    state.total = session.total_items;
    state.declined = null;
    el("startNote").textContent = "";
    renderRecovery(true);
    el("learner").textContent = name;
    show("startPanel", false);
    show("trainPanel", true);
    openSocket(session.session_id);
    await nextItem();
  } catch (err) {
    el("startNote").textContent = err.message;
  }
}

async function nextItem() {
  setError("");
  show("result", false);
  state.demoAvailable = false;
  el("demoBtn").disabled = true;
  el("answer").value = "";

  // 승인된 계획에서 온 세션은 문항이 계획에서 나온다. `/planned` 는 문항을
  // 꺼내고 손으로 표현하는 것을 한 번에 하고, **동기다** — 손이 끝난 뒤에
  // 돌아온다 (DECISIONS §46.2). 규칙 세션은 예전대로 `/next` + `/present` 다.
  if (state.planned) { return presentPlanned(); }

  try {
    state.prompt = await call("GET", `/api/sessions/${state.sessionId}/next`);
  } catch (err) {
    // 계획된 문항을 다 냈다면 요약으로 넘어간다.
    if (err.code === "SESSION_FINISHED") { return endSession(); }
    setError(err.message);
    return;
  }
  renderCounter();
  await present();
}

/**
 * [다시 보기]. 어느 경로로 다시 낼지는 **문항이 도착했는지**로 갈린다.
 *
 * 계획 세션에서 문항이 도착하기 전에 정지가 걸리면, 그 문항은 큐에 그대로
 * 남고 세션 상태도 `awaiting_item` 이다. 그 상태에서 `/present` 를 부르면
 * 표현할 문항이 없다며 `SESSION_STATE` 로 거부된다 — 큐에 있는 문항을
 * 다시 내려면 `/planned` 를 불러야 한다.
 *
 * 도착한 뒤의 다시 보기는 양쪽 다 `/present` 다. 지금 걸린 문항을 다시 낼
 * 뿐이고 큐를 건드리지 않는다.
 */
function replayItem() {
  if (state.planned && !state.landed) { return presentPlanned(); }
  return present();
}

/** 계획의 다음 문항. 동기라 돌아온 시점에 손은 이미 표현을 마쳤다. */
async function presentPlanned() {
  setAnswering(false);
  setMoving(true);
  setError("");
  el("status").textContent = "표현 준비 중";
  try {
    state.prompt = await call("POST", `/api/sessions/${state.sessionId}/planned`);
  } catch (err) {
    setMoving(false);
    el("dot").classList.remove("live");
    // 계획을 다 냈으면 요약으로 넘어간다. `/next` 와 같은 코드다.
    if (err.code === "SESSION_FINISHED") { return endSession(); }
    if (err.code === "STOPPED") {
      // 사람이 멈춘 것이다. **오류가 아니므로 오류 자리에 쓰지 않는다** — WS
      // 갈래와 같은 처리다. 동기 경로에서는 정지가 REST 응답으로 오므로
      // (§50.3) 여기서도 같이 다뤄야 한다. 문항은 큐에 그대로 남는다.
      showStopped();
      return;
    }
    setError(err.message);
    // 거부되어도 문항은 큐에 그대로 남는다. 다시 보기로 다시 시도할 수 있다.
    showStalled();
    return;
  }
  renderCounter();
  // WS 의 `done` 이 이미 답 입력을 열었다. 동기 응답이 그보다 늦게 올 수도
  // 있으므로 여기서도 한 번 더 맞춰 둔다 — 두 번 열어도 해가 없다.
  setMoving(false);
  setAnswering(true);
}

function renderCounter() {
  const p = state.prompt;
  // 트랙은 보여 주고, 길이는 판별 트랙에서만 보여 준다 (PRD 14.1).
  const track = TRACK_LABEL[p.track] || p.track;
  const length = p.track === "discrimination" ? ` · ${p.length}글자` : "";
  el("counter").textContent = `${p.index} / ${state.total} · ${track}${length}`;
}

async function present() {
  setAnswering(false);
  setMoving(true);
  setError("");
  el("status").textContent = "표현 준비 중";
  try {
    await call("POST", `/api/sessions/${state.sessionId}/present`);
  } catch (err) {
    setMoving(false);
    setError(err.message);
  }
}

async function submit() {
  setError("");
  const answer = el("answer").value.trim();
  if (!answer) return;

  setAnswering(false);
  let outcome;
  try {
    outcome = await call("POST", `/api/sessions/${state.sessionId}/answer`, { answer });
  } catch (err) {
    setError(err.message);
    setAnswering(true);
    return;
  }

  if (outcome.retry) {
    // 오답 1회째. 정답은 알려주지 않고 같은 문항을 느리게 다시 낸다.
    el("status").textContent = "다시 한 번 봅니다";
    el("answer").value = "";
    // 계획 세션은 재생도 계획 경로로 낸다. `/planned` 는 재생 대기를 보고
    // **같은 문항**을 다시 내며 큐에서 빼지 않는다 (기획서 5.2).
    if (state.planned) { return presentPlanned(); }
    state.prompt = await call("GET", `/api/sessions/${state.sessionId}/next`);
    renderCounter();
    await present();
    return;
  }

  renderResult(outcome);
  if (outcome.finished) {
    el("nextBtn").textContent = "요약 보기";
  }
}

function renderResult(outcome) {
  el("verdict").textContent = RESULT_LABEL[outcome.result] || outcome.result;
  el("reveal").textContent = outcome.expected ? `정답 ${outcome.expected}` : "";
  el("hint").textContent = outcome.demo && outcome.demo.hint ? outcome.demo.hint : "";
  state.demoAvailable = Boolean(outcome.demo);
  el("demoBtn").disabled = !state.demoAvailable;
  show("result", true);
  el("nextBtn").focus();
}

async function replayDemo() {
  if (!state.demoAvailable) return;
  setMoving(true);
  try {
    await call("POST", `/api/sessions/${state.sessionId}/demo`);
  } catch (err) {
    setMoving(false);
    setError(err.message);
  }
}

/** 비상 정지. 손만 멈춘다 — 세션은 그대로다. */
async function stopMotion() {
  try {
    await call("POST", "/api/device/stop");
  } catch (err) {
    setError(err.message);
    return;
  }
  el("dot").classList.remove("live");
  setMoving(false);
  showStopped();
}

async function endSession() {
  try {
    const summary = await call("POST", `/api/sessions/${state.sessionId}/end`);
    renderSummary(summary);
  } catch (err) {
    setError(err.message);
    return;
  }
  // 세션은 끝났고 락도 반납됐다. `session_id` 를 들고 있으면 heartbeat 가
  // 죽은 세션으로 계속 나간다 (§51). 요약은 그대로 둔다 — 시작 화면으로
  // 돌리지 않는다.
  state.sessionId = null;
  state.planned = false;
  state.prompt = null;
  renderRecovery(false);
  if (state.socket) { state.socket.close(); state.socket = null; }
  show("trainPanel", false);
  show("summaryPanel", true);
  el("counter").textContent = "";
}

function renderSummary(summary) {
  const container = el("summaryTables");
  container.innerHTML = "";

  for (const [track, s] of Object.entries(summary.by_track)) {
    const table = document.createElement("table");
    const pct = (v) => (v === null ? "—" : `${Math.round(v * 100)}%`);
    const ms = (v) => (v === null ? "—" : `${Math.round(v)}ms`);
    const confusions = (summary.confusions_by_track[track] || [])
      .map((c) => `${c.pair.join("/")} ${c.count}회`)
      .join(", ") || "—";

    table.innerHTML = `
      <caption>${TRACK_LABEL[track] || track} 트랙</caption>
      <tr><th>문항</th><td>${s.answered}</td></tr>
      <tr><th>정확도</th><td>${pct(s.accuracy)}</td></tr>
      <tr><th>순서 오류율</th><td>${pct(s.order_error_rate)}</td></tr>
      <tr><th>평균 응답</th><td>${ms(s.avg_response_ms)}</td></tr>
      <tr><th>혼동 쌍</th><td>${confusions}</td></tr>
    `;
    container.appendChild(table);
  }
}

// --------------------------------------------------------------------- //
// 강제 해제
// --------------------------------------------------------------------- //

/** 정지와 다르다. 세션이 끝나고 락이 반납된다. 한 번 눌러서는 실행되지 않는다. */
const RESET_LABEL = "세션 끝내고 손 놓기";
let resetArmed = null;

function disarmReset() {
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; }
  el("resetBtn").classList.remove("armed");
  el("resetBtn").textContent = RESET_LABEL;
}

async function resetDevice() {
  if (!resetArmed) {
    // 1단계: 확인을 받는다. 8초 안에 다시 누르지 않으면 없던 일이 된다.
    el("resetBtn").classList.add("armed");
    el("resetBtn").textContent = "정말 끝냅니다 — 한 번 더";
    el("resetNote").textContent =
      "진행 중인 세션이 중단됩니다. 답한 문항까지는 남습니다.";
    resetArmed = setTimeout(() => {
      disarmReset();
      el("resetNote").textContent = "";
    }, 8000);
    return;
  }

  clearTimeout(resetArmed);
  resetArmed = null;
  setError("");
  try {
    const result = await call("POST", "/api/device/reset");
    disarmReset();
    // 무엇을 끝냈는지 그대로 쓴다. 끝낸 것이 없으면 없다고 쓴다. 이 문구는
    // 시작 화면에 남는다 — 해제 뒤에는 해제 버튼 자체가 사라지기 때문이다.
    const said = result.ended_sessions.length
      ? `세션 ${result.ended_sessions.join(", ")} 을 종료하고 손을 놓았습니다.`
      : "잠긴 세션이 없습니다. 손을 안전 자세로 되돌렸습니다.";
    // 들고 있던 session_id 를 **여기서 버린다.** 남겨 두면 heartbeat 와 구동
    // 요청이 죽은 세션으로 계속 나간다 (§51).
    abandonSession(said);
    // 해제한 뒤에는 잡힌 것이 없다. `lock_holder` 를 다시 볼 때까지 숨긴다.
    renderRecovery(false);
  } catch (err) {
    disarmReset();
    el("resetNote").textContent = "";
    setError(err.message);
  }
}

el("stopBtn").addEventListener("click", stopMotion);
el("resetBtn").addEventListener("click", resetDevice);
el("startBtn").addEventListener("click", startSession);
el("name").addEventListener("keydown", (e) => { if (e.key === "Enter") startSession(); });
el("submitBtn").addEventListener("click", submit);
el("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
el("replayBtn").addEventListener("click", replayItem);
el("demoBtn").addEventListener("click", replayDemo);
el("nextBtn").addEventListener("click", () => {
  if (el("nextBtn").textContent === "요약 보기") { endSession(); } else { nextItem(); }
});
el("againBtn").addEventListener("click", () => location.reload());
el("joinBtn").addEventListener("click", joinSession);
el("laterBtn").addEventListener("click", declineJoin);
el("rejoinBtn").addEventListener("click", undeclineJoin);

// 기동할 때 한 번 묻고, 시작 화면에 머무는 동안만 되묻는다.
checkOpenSession();
startOpenPoll();

// 락 heartbeat. 세션이 살아 있음을 서버에 알린다 (PRD 10장: 15초 주기).
//
// 조용히 삼키는 것은 **여기서 처리하지 않기 때문**이다. 409 가 오면 `call()`
// 이 확인을 걸고, 세션이 죽었으면 `abandonSession()` 이 `state.sessionId` 를
// 비운다. 그러면 이 타이머는 다음 틱부터 아무것도 보내지 않는다 (§51).
setInterval(() => {
  if (state.sessionId) {
    call("POST", `/api/sessions/${state.sessionId}/heartbeat`).catch(() => {});
  }
}, 10000);
</script>
</body>
</html>
